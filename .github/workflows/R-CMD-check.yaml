on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch lunapi releases that break us

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: macos-latest,  r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # warm up: let reticulate provision Python + lunapi before the check
      - name: Provision lunapi
        # run as an R script, so no shell quoting is involved (PowerShell on
        # Windows mangles quotes in Rscript -e '...')
        shell: Rscript {0}
        run: |
          reticulate::py_require("lunapi>=1.7.1,<2", python_version = ">=3.9,<3.15")
          lp <- reticulate::import("lunapi")
          print(reticulate::py_config())
          cat("lunapi", reticulate::py_to_r(lp$`__version__`), "ok\n")
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
